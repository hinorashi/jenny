<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ef5350">
    <title>Pokédex demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20283a;
        background: #f4f6fb;
      }

      * { box-sizing: border-box; }

      body { margin: 0; min-height: 100vh; }

      header {
        padding: 2.25rem 1rem 5rem;
        color: white;
        text-align: center;
        background: linear-gradient(130deg, #e53935, #ef5350 60%, #ff8a65);
      }

      h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 6vw, 3.5rem); }
      header p { margin: 0; color: #fff4f2; }

      main {
        width: min(760px, calc(100% - 2rem));
        margin: -2.5rem auto 3rem;
      }

      form {
        display: flex;
        gap: .75rem;
        padding: .75rem;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 12px 36px #20283a1a;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: .8rem 1rem;
        border: 1px solid #dce1ec;
        border-radius: .65rem;
        font: inherit;
      }

      button {
        padding: .8rem 1.25rem;
        border: 0;
        border-radius: .65rem;
        color: white;
        background: #25304a;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled { opacity: .65; cursor: wait; }

      #status { min-height: 1.5rem; margin: 1rem .25rem; color: #556078; }
      #status.error { color: #b3261e; }

      .card {
        display: grid;
        grid-template-columns: minmax(180px, 260px) 1fr;
        gap: 1.5rem;
        align-items: center;
        padding: 1.5rem;
        border: 1px solid #e6e9f0;
        border-radius: 1.25rem;
        background: white;
        box-shadow: 0 12px 36px #20283a12;
      }

      .artwork {
        display: grid;
        min-height: 220px;
        place-items: center;
        border-radius: 1rem;
        background: radial-gradient(circle, #fff 15%, #f1f3f8 75%);
      }

      .artwork img { width: 100%; max-width: 240px; height: 220px; object-fit: contain; }
      .heading { display: flex; gap: .75rem; align-items: baseline; flex-wrap: wrap; }
      h2 { margin: 0; text-transform: capitalize; font-size: 2rem; }
      .number { color: #768098; font-weight: 700; }
      .types { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; }
      .type { padding: .35rem .7rem; border-radius: 999px; color: #37415a; background: #edf0f6; text-transform: capitalize; }
      .description { line-height: 1.6; }
      .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; margin: 1rem 0 0; padding: 0; list-style: none; }
      .stats li { padding: .55rem .7rem; border-radius: .6rem; background: #f5f6fa; text-transform: capitalize; }
      .stats strong { float: right; }
      [hidden] { display: none !important; }

      @media (max-width: 600px) {
        .card { grid-template-columns: 1fr; }
        .artwork { min-height: 180px; }
        .artwork img { height: 180px; }
        form { gap: .5rem; }
        button { padding-inline: .9rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pokédex</h1>
      <p>A tiny demo powered by PokéAPI</p>
    </header>
    <main>
      <form id="search-form">
        <label for="pokemon-name" hidden>Pokémon name or number</label>
        <input id="pokemon-name" name="pokemon" autocomplete="off" placeholder="Try Pikachu or 25" required>
        <button id="search-button" type="submit">Search</button>
      </form>
      <p id="status" role="status" aria-live="polite">Search by Pokémon name or Pokédex number.</p>
      <article id="pokemon-card" class="card" hidden>
        <div class="artwork"><img id="pokemon-image" alt=""></div>
        <div>
          <div class="heading"><h2 id="pokemon-title"></h2><span id="pokemon-number" class="number"></span></div>
          <div id="pokemon-types" class="types"></div>
          <p>Base experience: <strong id="pokemon-experience"></strong></p>
          <p id="pokemon-description" class="description"></p>
          <ul id="pokemon-stats" class="stats"></ul>
        </div>
      </article>
    </main>
    <script>
      const form = document.querySelector("#search-form");
      const input = document.querySelector("#pokemon-name");
      const button = document.querySelector("#search-button");
      const status = document.querySelector("#status");
      const card = document.querySelector("#pokemon-card");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = input.value.trim();
        if (!query) return;

        button.disabled = true;
        status.className = "";
        status.textContent = "Looking up Pokémon…";
        card.hidden = true;
        try {
          const response = await fetch(`/api/pokemon/${encodeURIComponent(query)}`);
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Could not load Pokémon.");
          renderPokemon(data);
          status.textContent = "";
        } catch (error) {
          status.className = "error";
          status.textContent = error.message || "Request failed. Please try again.";
        } finally {
          button.disabled = false;
        }
      });

      function renderPokemon(pokemon) {
        document.querySelector("#pokemon-title").textContent = pokemon.name;
        document.querySelector("#pokemon-number").textContent = `#${String(pokemon.id).padStart(3, "0")}`;
        document.querySelector("#pokemon-experience").textContent = pokemon.baseExperience;
        document.querySelector("#pokemon-description").textContent = pokemon.description || "No English description available.";

        const image = document.querySelector("#pokemon-image");
        image.src = pokemon.imageUrl || "";
        image.alt = `${pokemon.name} artwork`;
        image.hidden = !pokemon.imageUrl;

        const types = document.querySelector("#pokemon-types");
        types.replaceChildren(...pokemon.types.map((type) => {
          const badge = document.createElement("span");
          badge.className = "type";
          badge.textContent = type;
          return badge;
        }));

        const stats = document.querySelector("#pokemon-stats");
        stats.replaceChildren(...pokemon.stats.map((stat) => {
          const item = document.createElement("li");
          item.textContent = stat.name;
          const value = document.createElement("strong");
          value.textContent = stat.value;
          item.append(value);
          return item;
        }));
        card.hidden = false;
      }
    </script>
  </body>
</html>
